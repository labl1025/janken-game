<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#ffc20a"
>

<title>じゃんけん！</title>


<style>

/* =========================
   基本
========================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}


html,
body{

  margin:0;

  width:100%;
  height:100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background:#f5f5f5;

}


body{

  display:flex;

  justify-content:center;
  align-items:center;

  overflow:hidden;

}


/* =========================
   アプリ本体
========================= */

.app{

  width:min(100vw,430px);

  height:100dvh;

  min-height:620px;

  background:#ffc20a;

  position:relative;

  overflow:hidden;

  display:flex;

  flex-direction:column;

}


/* =========================
   リセットボタン
========================= */

.close{

  position:absolute;

  right:18px;
  top:14px;

  color:#fff;

  font-size:34px;

  font-weight:200;

  line-height:1;

  background:none;

  border:0;

  z-index:20;

  cursor:pointer;

}


/* =========================
   タイトル
========================= */

.title{

  height:105px;

  display:flex;

  justify-content:center;

  align-items:flex-end;

  padding-bottom:6px;

  color:#fff;

  font-size:34px;

  font-weight:900;

  letter-spacing:.06em;

  text-shadow:
    0 2px 0 rgba(0,0,0,.04);

}


/* =========================
   メインステージ
========================= */

.stage{

  flex:1;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  padding:
    0
    10px
    12px;

  min-width:0;

}


/* =========================
   セリフ
========================= */

.speech{

  height:64px;

  width:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#fff;

  font-size:
    clamp(
      20px,
      6.5vw,
      28px
    );

  font-weight:900;

  letter-spacing:.04em;

  transform:rotate(-3deg);

  text-shadow:
    0 2px 0 rgba(0,0,0,.05);

  white-space:nowrap;

}


/* =========================
   キャラクターエリア
========================= */

.character{

  width:260px;

  height:250px;

  display:flex;

  align-items:center;

  justify-content:center;

  margin:
    2px
    0
    10px;

  position:relative;

}


/* =========================
   キャラクター画像
========================= */

.piplup{

  width:260px;

  height:250px;

  object-fit:contain;

  transition:
    transform .25s ease,
    filter .25s ease;

  filter:
    drop-shadow(
      0 5px 0 rgba(0,0,0,.08)
    );

}


/* =========================
   通常
========================= */

.character.normal .piplup{

  animation:none;

}


/* =========================
   じゃんけん中
========================= */

.character.playing .piplup{

  animation:
    bounce .35s ease;

}


/* =========================
   勝ち
========================= */

.character.win .piplup{

  animation:
    happy .65s ease;

  filter:
    drop-shadow(
      0 5px 0 rgba(0,0,0,.08)
    )
    brightness(1.08);

}


/* =========================
   負け
========================= */

.character.lose .piplup{

  animation:
    sad .75s ease;

  filter:
    drop-shadow(
      0 5px 0 rgba(0,0,0,.08)
    )
    brightness(.88);

}


/* =========================
   あいこ
========================= */

.character.draw .piplup{

  animation:
    confused .6s ease;

}


/* =========================
   結果
========================= */

.result{

  min-height:55px;

  color:#fff;

  font-size:27px;

  font-weight:900;

  text-align:center;

  line-height:1.25;

  white-space:pre-line;

  text-shadow:
    0 2px 0 rgba(0,0,0,.05);

}


/* =========================
   手のボタン
========================= */

.hands{

  display:flex;

  gap:22px;

  margin-top:8px;

}


.hand{

  width:82px;
  height:82px;

  border:0;

  border-radius:50%;

  background:#7441c7;

  display:flex;

  align-items:center;
  justify-content:center;

  box-shadow:
    0 4px 0 rgba(65,24,123,.25);

  cursor:pointer;

  transition:
    transform .08s,
    filter .15s;

}


.hand:active{

  transform:scale(.91);

}


.hand[disabled]{

  filter:grayscale(1);

  opacity:.45;

}


.hand span{

  font-size:51px;

  filter:
    drop-shadow(
      0 2px 0 rgba(0,0,0,.12)
    );

}


/* =========================
   下部コントロール
========================= */

.controls{

  height:92px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:12px;

}


.small{

  border:0;

  border-radius:999px;

  padding:
    11px
    18px;

  background:
    rgba(255,255,255,.92);

  color:#5b3990;

  font-size:15px;

  font-weight:800;

  box-shadow:
    0 3px 0 rgba(0,0,0,.1);

  cursor:pointer;

}


/* =========================
   結果アニメーション
========================= */

.flash{

  animation:
    flash .25s ease;

}


/* =========================
   じゃんけん中
========================= */

@keyframes bounce{

  0%{

    transform:
      translateY(0);

  }

  40%{

    transform:
      translateY(-13px);

  }

  100%{

    transform:
      translateY(0);

  }

}


/* =========================
   勝ち
========================= */

@keyframes happy{

  0%{

    transform:
      translateY(0)
      rotate(0)
      scale(1);

  }

  25%{

    transform:
      translateY(-22px)
      rotate(-5deg)
      scale(1.08);

  }

  50%{

    transform:
      translateY(-8px)
      rotate(5deg)
      scale(1.05);

  }

  75%{

    transform:
      translateY(-15px)
      rotate(-3deg)
      scale(1.06);

  }

  100%{

    transform:
      translateY(0)
      rotate(0)
      scale(1);

  }

}


/* =========================
   負け
========================= */

@keyframes sad{

  0%{

    transform:
      translateY(0)
      rotate(0);

  }

  20%{

    transform:
      translateY(5px)
      rotate(-4deg);

  }

  40%{

    transform:
      translateY(8px)
      rotate(4deg);

  }

  60%{

    transform:
      translateY(5px)
      rotate(-3deg);

  }

  80%{

    transform:
      translateY(7px)
      rotate(2deg);

  }

  100%{

    transform:
      translateY(0)
      rotate(0);

  }

}


/* =========================
   あいこ
========================= */

@keyframes confused{

  0%{

    transform:
      rotate(0);

  }

  20%{

    transform:
      rotate(-7deg);

  }

  40%{

    transform:
      rotate(7deg);

  }

  60%{

    transform:
      rotate(-6deg);

  }

  80%{

    transform:
      rotate(4deg);

  }

  100%{

    transform:
      rotate(0);

  }

}


/* =========================
   結果テキスト
========================= */

@keyframes flash{

  0%{

    transform:
      scale(1);

  }

  50%{

    transform:
      scale(1.12);

  }

  100%{

    transform:
      scale(1);

  }

}


/* =========================
   小さい画面
========================= */

@media (max-height:700px){

  .title{

    height:75px;

  }


  .character{

    transform:scale(.82);

    margin:
      -18px
      0
      -8px;

  }


  .hands{

    gap:14px;

  }


  .hand{

    width:72px;
    height:72px;

  }


  .controls{

    height:70px;

  }

}

</style>

</head>


<body>


<div class="app">


  <!-- =====================
       リセット
  ====================== -->

  <button
    class="close"
    aria-label="リセット"
    onclick="resetGame()">

    ×

  </button>


  <!-- =====================
       タイトル
  ====================== -->

  <div class="title">

    じゃんけん！

  </div>


  <!-- =====================
       メイン
  ====================== -->

  <section class="stage">


    <!-- =====================
         セリフ
    ====================== -->

    <div
      class="speech"
      id="speech">

      じゃーん　けーん

    </div>


    <!-- =====================
         キャラクター
    ====================== -->

    <div
      class="character normal"
      id="character">

      <img
        class="piplup"
        id="piplup"
        src="./piplup-normal.png"
        alt="青いペンギン風キャラクター">

    </div>


    <!-- =====================
         結果
    ====================== -->

    <div
      class="result"
      id="result">

      どれを出す？

    </div>


    <!-- =====================
         手
    ====================== -->

    <div
      class="hands"
      id="hands">


      <!-- グー -->

      <button
        class="hand"
        onclick="play('rock')"
        aria-label="グー">

        <span>
          ✊
        </span>

      </button>


      <!-- チョキ -->

      <button
        class="hand"
        onclick="play('scissors')"
        aria-label="チョキ">

        <span>
          ✌️
        </span>

      </button>


      <!-- パー -->

      <button
        class="hand"
        onclick="play('paper')"
        aria-label="パー">

        <span>
          🖐️
        </span>

      </button>


    </div>

  </section>


  <!-- =====================
       音
  ====================== -->

  <div class="controls">

    <button
      class="small"
      onclick="toggleSound()"
      id="soundBtn">

      🔊 音ON

    </button>

  </div>


</div>



<script>


/* =========================
   基本設定
========================= */

const hands = {

  rock:"✊",

  scissors:"✌️",

  paper:"🖐️"

};


const names = {

  rock:"グー",

  scissors:"チョキ",

  paper:"パー"

};


/* =========================
   キャラクター画像
========================= */

const piplupImages = {

  normal:
    "./piplup-normal.png",

  win:
    "./piplup-win.png",

  lose:
    "./piplup-lose.png",

  draw:
    "./piplup-draw.png"

};


/* =========================
   状態
========================= */

let sound = true;

let busy = false;


/* =========================
   CPUの手
========================= */

function cpuChoice(){

  const choices = [

    "rock",

    "scissors",

    "paper"

  ];


  return choices[
    Math.floor(
      Math.random() *
      choices.length
    )
  ];

}


/* =========================
   勝敗判定
========================= */

function judge(player,cpu){

  /*
   * あいこ
   */

  if(player === cpu){

    return "draw";

  }


  /*
   * 勝ち
   */

  if(

    (
      player === "rock" &&
      cpu === "scissors"
    )

    ||

    (
      player === "scissors" &&
      cpu === "paper"
    )

    ||

    (
      player === "paper" &&
      cpu === "rock"
    )

  ){

    return "win";

  }


  /*
   * 負け
   */

  return "lose";

}


/* =========================
   キャラクター画像変更
========================= */

function changePiplup(state){

  const piplup =
    document.getElementById(
      "piplup"
    );


  if(!piplup){

    return;

  }


  /*
   * 状態に応じて画像変更
   */

  piplup.src =
    piplupImages[state];


  /*
   * alt変更
   */

  if(state === "normal"){

    piplup.alt =
      "青いペンギン風キャラクター";

  }

  else if(state === "win"){

    piplup.alt =
      "喜んでいる青いペンギン風キャラクター";

  }

  else if(state === "lose"){

    piplup.alt =
      "悲しそうな青いペンギン風キャラクター";

  }

  else if(state === "draw"){

    piplup.alt =
      "困惑している青いペンギン風キャラクター";

  }

}


/* =========================
   効果音
========================= */

function beep(freq,dur=80){

  if(!sound){

    return;

  }


  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    const ctx =
      new AudioContext();


    const oscillator =
      ctx.createOscillator();


    const gain =
      ctx.createGain();


    oscillator.frequency.value =
      freq;


    oscillator.type =
      "sine";


    gain.gain.value =
      .035;


    oscillator.connect(gain);


    gain.connect(
      ctx.destination
    );


    oscillator.start();


    setTimeout(()=>{

      oscillator.stop();

      ctx.close();

    },dur);

  }

  catch(e){

    /*
     * 音が使えない場合は何もしない
     */

  }

}


/* =========================
   じゃんけん
========================= */

function play(player){

  /*
   * 連打防止
   */

  if(busy){

    return;

  }


  busy = true;


  /*
   * ボタン無効化
   */

  document
    .querySelectorAll(".hand")
    .forEach(button=>{

      button.disabled =
        true;

    });


  const character =
    document.getElementById(
      "character"
    );


  const speech =
    document.getElementById(
      "speech"
    );


  const result =
    document.getElementById(
      "result"
    );


  /*
   * キャラクター状態をリセット
   */

  character.classList.remove(

    "normal",
    "win",
    "lose",
    "draw",
    "playing"

  );


  /*
   * 通常画像に戻す
   */

  changePiplup(
    "normal"
  );


  /*
   * 通常クラス
   */

  character.classList.add(
    "playing"
  );


  /*
   * セリフ
   */

  speech.textContent =
    "じゃーん　けーん";


  /*
   * 結果を一旦消す
   */

  result.textContent =
    "";


  /*
   * じゃんけん音
   */

  beep(
    520,
    70
  );


  /*
   * 「ぽん！」
   */

  setTimeout(()=>{

    speech.textContent =
      "ぽん！";


    beep(
      780,
      100
    );

  },650);


  /*
   * 結果発表
   */

  setTimeout(()=>{


    /*
     * CPUの手
     */

    const cpu =
      cpuChoice();


    /*
     * 勝敗
     */

    const r =
      judge(
        player,
        cpu
      );


    /*
     * じゃんけん中終了
     */

    character.classList.remove(
      "playing"
    );


    /*
     * 勝ち
     */

    if(r === "win"){

      result.textContent =
        "あなたの勝ち！ 🎉";


      /*
       * 勝ち画像
       */

      changePiplup(
        "win"
      );


      character.classList.add(
        "win"
      );


      /*
       * 勝利音
       */

      beep(
        900,
        120
      );

    }


    /*
     * 負け
     */

    else if(r === "lose"){

      result.textContent =
        "あなたの負け…";


      /*
       * 負け画像
       */

      changePiplup(
        "lose"
      );


      character.classList.add(
        "lose"
      );


      /*
       * 敗北音
       */

      beep(
        260,
        120
      );

    }


    /*
     * あいこ
     */

    else{

      result.textContent =
        "あいこ！";


      /*
       * あいこ画像
       */

      changePiplup(
        "draw"
      );


      character.classList.add(
        "draw"
      );


      /*
       * あいこ音
       */

      beep(
        620,
        120
      );

    }


    /*
     * 上部表示
     */

    speech.textContent =
      `あなた：${names[player]}　相手：${names[cpu]}`;


    /*
     * 結果アニメーション
     */

    result.classList.remove(
      "flash"
    );


    void result.offsetWidth;


    result.classList.add(
      "flash"
    );


    /*
     * 少し待って再操作可能
     */

    setTimeout(()=>{

      document
        .querySelectorAll(".hand")
        .forEach(button=>{

          button.disabled =
            false;

        });


      busy = false;

    },450);


  },1000);

}


/* =========================
   リセット
========================= */

function resetGame(){

  /*
   * ゲーム状態
   */

  busy = false;


  const character =
    document.getElementById(
      "character"
    );


  const speech =
    document.getElementById(
      "speech"
    );


  const result =
    document.getElementById(
      "result"
    );


  /*
   * キャラクター状態
   */

  character.classList.remove(

    "win",
    "lose",
    "draw",
    "playing"

  );


  character.classList.add(
    "normal"
  );


  /*
   * 通常画像
   */

  changePiplup(
    "normal"
  );


  /*
   * テキスト
   */

  speech.textContent =
    "じゃーん　けーん";


  result.textContent =
    "どれを出す？";


  /*
   * 結果アニメーション削除
   */

  result.classList.remove(
    "flash"
  );


  /*
   * ボタン有効化
   */

  document
    .querySelectorAll(".hand")
    .forEach(button=>{

      button.disabled =
        false;

    });

}


/* =========================
   音ON/OFF
========================= */

function toggleSound(){

  sound = !sound;


  document.getElementById(
    "soundBtn"
  ).textContent =

    sound

      ? "🔊 音ON"

      : "🔇 音OFF";

}

</script>


</body>

</html>
