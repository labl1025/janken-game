<!doctype html>
<html lang="ja">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#ffc20a"
>

<title>じゃんけん！</title>


<style>

/* =========================
   基本
========================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}


html,
body{

  margin:0;

  width:100%;
  height:100%;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background:#f5f5f5;

}


body{

  display:flex;

  justify-content:center;
  align-items:center;

  overflow:hidden;

}


/* =========================
   アプリ本体
========================= */

.app{

  width:min(100vw,430px);

  height:100dvh;

  min-height:620px;

  background:#ffc20a;

  position:relative;

  overflow:hidden;

  display:flex;

  flex-direction:column;

}


/* =========================
   リセットボタン
========================= */

.close{

  position:absolute;

  right:18px;
  top:14px;

  color:#fff;

  font-size:34px;

  font-weight:200;

  line-height:1;

  background:none;

  border:0;

  z-index:20;

  cursor:pointer;

}


/* =========================
   タイトル
========================= */

.title{

  height:105px;

  display:flex;

  justify-content:center;

  align-items:flex-end;

  padding-bottom:6px;

  color:#fff;

  font-size:34px;

  font-weight:900;

  letter-spacing:.06em;

  text-shadow:
    0 2px 0 rgba(0,0,0,.04);

}


/* =========================
   メインステージ
========================= */

.stage{

  flex:1;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  padding:
    0
    10px
    12px;

  min-width:0;

}


/* =========================
   セリフ
========================= */

.speech{

  min-height:64px;

  width:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#fff;

  font-size:
    clamp(
      20px,
      6.5vw,
      28px
    );

  font-weight:900;

  letter-spacing:.04em;

  transform:rotate(-3deg);

  text-shadow:
    0 2px 0 rgba(0,0,0,.05);

  white-space:nowrap;

}


/* =========================
   キャラクターエリア
========================= */

.character{

  width:260px;

  height:250px;

  display:flex;

  align-items:center;

  justify-content:center;

  margin:
    2px
    0
    10px;

  position:relative;

}


/* =========================
   キャラクター画像
========================= */

.piplup{

  width:260px;

  height:250px;

  object-fit:contain;

  transition:
    transform .25s ease,
    filter .25s ease;

  filter:
    drop-shadow(
      0 5px 0 rgba(0,0,0,.08)
    );

}


/* =========================
   通常
========================= */

.character.normal .piplup{

  animation:none;

}


/* =========================
   じゃんけん中
========================= */

.character.playing .piplup{

  animation:
    bounce .35s ease infinite;

}


/* =========================
   勝ち
========================= */

.character.win .piplup{

  animation:
    happy .65s ease;

  filter:
    drop-shadow(
      0 5px 0 rgba(0,0,0,.08)
    )
    brightness(1.08);

}


/* =========================
   負け
========================= */

.character.lose .piplup{

  animation:
    sad .75s ease;

  filter:
    drop-shadow(
      0 5px 0 rgba(0,0,0,.08)
    )
    brightness(.88);

}


/* =========================
   あいこ
========================= */

.character.draw .piplup{

  animation:
    confused .6s ease;

}


/* =========================
   相手の手表示
========================= */

.opponent{

  min-height:0;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  margin-top:-4px;

  margin-bottom:5px;

}


.opponent-label{

  color:#fff;

  font-size:15px;

  font-weight:800;

  line-height:1.2;

  margin-bottom:3px;

  text-shadow:
    0 2px 0 rgba(0,0,0,.08);

}


.opponent-hand{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:7px;

  min-width:150px;

  min-height:48px;

  padding:
    5px
    14px;

  border-radius:999px;

  background:
    rgba(255,255,255,.94);

  color:#5b3990;

  box-shadow:
    0 3px 0 rgba(0,0,0,.12);

  font-size:19px;

  font-weight:900;

}


.opponent-hand .emoji{

  font-size:32px;

  line-height:1;

}


.opponent-hand.reveal{

  animation:
    opponentReveal .35s ease;

}


/* =========================
   結果
========================= */

.result{

  min-height:55px;

  color:#fff;

  font-size:27px;

  font-weight:900;

  text-align:center;

  line-height:1.25;

  white-space:pre-line;

  text-shadow:
    0 2px 0 rgba(0,0,0,.05);

}


/* =========================
   手のボタン
========================= */

.hands{

  display:flex;

  gap:22px;

  margin-top:8px;

}


.hand{

  width:82px;
  height:82px;

  border:0;

  border-radius:50%;

  background:#7441c7;

  display:flex;

  align-items:center;
  justify-content:center;

  box-shadow:
    0 4px 0 rgba(65,24,123,.25);

  cursor:pointer;

  transition:
    transform .08s,
    filter .15s;

}


.hand:active{

  transform:scale(.91);

}


.hand[disabled]{

  filter:grayscale(1);

  opacity:.45;

}


.hand span{

  font-size:51px;

  filter:
    drop-shadow(
      0 2px 0 rgba(0,0,0,.12)
    );

}


/* =========================
   下部コントロール
========================= */

.controls{

  height:92px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:12px;

}


.small{

  border:0;

  border-radius:999px;

  padding:
    11px
    18px;

  background:
    rgba(255,255,255,.92);

  color:#5b3990;

  font-size:15px;

  font-weight:800;

  box-shadow:
    0 3px 0 rgba(0,0,0,.1);

  cursor:pointer;

}


/* =========================
   結果アニメーション
========================= */

.flash{

  animation:
    flash .25s ease;

}


/* =========================
   じゃんけん中
========================= */

@keyframes bounce{

  0%{

    transform:
      translateY(0);

  }

  50%{

    transform:
      translateY(-12px);

  }

  100%{

    transform:
      translateY(0);

  }

}


/* =========================
   勝ち
========================= */

@keyframes happy{

  0%{

    transform:
      translateY(0)
      rotate(0)
      scale(1);

  }

  25%{

    transform:
      translateY(-22px)
      rotate(-5deg)
      scale(1.08);

  }

  50%{

    transform:
      translateY(-8px)
      rotate(5deg)
      scale(1.05);

  }

  75%{

    transform:
      translateY(-15px)
      rotate(-3deg)
      scale(1.06);

  }

  100%{

    transform:
      translateY(0)
      rotate(0)
      scale(1);

  }

}


/* =========================
   負け
========================= */

@keyframes sad{

  0%{

    transform:
      translateY(0)
      rotate(0);

  }

  20%{

    transform:
      translateY(5px)
      rotate(-4deg);

  }

  40%{

    transform:
      translateY(8px)
      rotate(4deg);

  }

  60%{

    transform:
      translateY(5px)
      rotate(-3deg);

  }

  80%{

    transform:
      translateY(7px)
      rotate(2deg);

  }

  100%{

    transform:
      translateY(0)
      rotate(0);

  }

}


/* =========================
   あいこ
========================= */

@keyframes confused{

  0%{

    transform:
      rotate(0);

  }

  20%{

    transform:
      rotate(-7deg);

  }

  40%{

    transform:
      rotate(7deg);

  }

  60%{

    transform:
      rotate(-6deg);

  }

  80%{

    transform:
      rotate(4deg);

  }

  100%{

    transform:
      rotate(0);

  }

}


/* =========================
   相手の手が出るアニメーション
========================= */

@keyframes opponentReveal{

  0%{

    transform:
      scale(.65)
      translateY(-8px);

    opacity:0;

  }

  60%{

    transform:
      scale(1.12)
      translateY(0);

    opacity:1;

  }

  100%{

    transform:
      scale(1)
      translateY(0);

    opacity:1;

  }

}


/* =========================
   結果テキスト
========================= */

@keyframes flash{

  0%{

    transform:
      scale(1);

  }

  50%{

    transform:
      scale(1.12);

  }

  100%{

    transform:
      scale(1);

  }

}


/* =========================
   小さい画面
========================= */

@media (max-height:700px){

  .title{

    height:75px;

  }


  .character{

    transform:scale(.82);

    margin:
      -18px
      0
      -8px;

  }


  .opponent{

    transform:scale(.9);

    margin-top:-8px;

    margin-bottom:-2px;

  }


  .hands{

    gap:14px;

  }


  .hand{

    width:72px;
    height:72px;

  }


  .controls{

    height:70px;

  }

}

</style>

</head>


<body>


<div class="app">


  <!-- =====================
       リセット
  ====================== -->

  <button
    class="close"
    aria-label="リセット"
    onclick="resetGame()">

    ×

  </button>


  <!-- =====================
       タイトル
  ====================== -->

  <div class="title">

    じゃんけん！

  </div>


  <!-- =====================
       メイン
  ====================== -->

  <section class="stage">


    <!-- =====================
         セリフ
    ====================== -->

    <div
      class="speech"
      id="speech">

      じゃーん　けーん

    </div>


    <!-- =====================
         キャラクター
    ====================== -->

    <div
      class="character normal"
      id="character">

      <img
        class="piplup"
        id="piplup"
        src="./piplup-normal.png"
        alt="青いペンギン風キャラクター">

    </div>


    <!-- =====================
         相手の手
    ====================== -->

    <div
      class="opponent"
      id="opponent">

      <div class="opponent-label">

        相手の手

      </div>


      <div
        class="opponent-hand"
        id="opponentHand">

        <span class="emoji">
          ❔
        </span>

        <span id="opponentName">
          ？？？
        </span>

      </div>

    </div>


    <!-- =====================
         結果
    ====================== -->

    <div
      class="result"
      id="result">

      どれを出す？

    </div>


    <!-- =====================
         手
    ====================== -->

    <div
      class="hands"
      id="hands">


      <!-- グー -->

      <button
        class="hand"
        onclick="play('rock')"
        aria-label="グー">

        <span>
          ✊
        </span>

      </button>


      <!-- チョキ -->

      <button
        class="hand"
        onclick="play('scissors')"
        aria-label="チョキ">

        <span>
          ✌️
        </span>

      </button>


      <!-- パー -->

      <button
        class="hand"
        onclick="play('paper')"
        aria-label="パー">

        <span>
          🖐️
        </span>

      </button>


    </div>

  </section>


  <!-- =====================
       音
  ====================== -->

  <div class="controls">

    <button
      class="small"
      onclick="toggleSound()"
      id="soundBtn">

      🔊 音ON

    </button>

  </div>


</div>



<script>


/* =========================
   基本設定
========================= */

const hands = {

  rock:"✊",

  scissors:"✌️",

  paper:"🖐️"

};


const names = {

  rock:"グー",

  scissors:"チョキ",

  paper:"パー"

};


/* =========================
   キャラクター画像
========================= */

const piplupImages = {

  normal:
    "./piplup-normal.png",

  win:
    "./piplup-win.png",

  lose:
    "./piplup-lose.png",

  draw:
    "./piplup-draw.png"

};


/* =========================
   状態
========================= */

let sound = true;

let busy = false;


/* =========================
   AudioContext
   ※毎回作らず1つを使う
========================= */

let audioContext = null;


function getAudioContext(){

  if(!audioContext){

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContext){

      return null;

    }

    audioContext =
      new AudioContext();

  }


  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume();

  }


  return audioContext;

}


/* =========================
   1音鳴らす
========================= */

function playTone(
  frequency,
  duration = 100,
  type = "sine",
  volume = 0.06,
  delay = 0
){

  if(!sound){

    return;

  }


  const ctx =
    getAudioContext();


  if(!ctx){

    return;

  }


  const start =
    ctx.currentTime + delay;


  const oscillator =
    ctx.createOscillator();


  const gain =
    ctx.createGain();


  oscillator.type =
    type;


  oscillator.frequency.setValueAtTime(
    frequency,
    start
  );


  gain.gain.setValueAtTime(
    0.0001,
    start
  );


  gain.gain.exponentialRampToValueAtTime(
    volume,
    start + 0.015
  );


  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    start + duration / 1000
  );


  oscillator.connect(gain);

  gain.connect(
    ctx.destination
  );


  oscillator.start(start);

  oscillator.stop(
    start + duration / 1000 + 0.02
  );

}


/* =========================
   じゃんけん中の音
========================= */

function playCountSound(){

  /*
   * ポンポンポン
   */

  playTone(
    520,
    100,
    "square",
    0.035,
    0
  );


  playTone(
    520,
    100,
    "square",
    0.035,
    0.25
  );


  playTone(
    620,
    140,
    "square",
    0.05,
    0.50
  );

}


/* =========================
   ポン！の音
========================= */

function playPonSound(){

  playTone(
    880,
    90,
    "square",
    0.07,
    0
  );


  playTone(
    1175,
    150,
    "sine",
    0.065,
    0.06
  );

}


/* =========================
   勝利音
========================= */

function playWinSound(){

  /*
   * ド → ミ → ソ → 高いド
   */

  playTone(
    523,
    130,
    "sine",
    0.07,
    0
  );


  playTone(
    659,
    130,
    "sine",
    0.07,
    0.12
  );


  playTone(
    784,
    130,
    "sine",
    0.07,
    0.24
  );


  playTone(
    1047,
    260,
    "sine",
    0.08,
    0.36
  );

}


/* =========================
   敗北音
========================= */

function playLoseSound(){

  /*
   * 下がっていく音
   */

  playTone(
    440,
    180,
    "sawtooth",
    0.045,
    0
  );


  playTone(
    349,
    180,
    "sawtooth",
    0.045,
    0.18
  );


  playTone(
    262,
    280,
    "sawtooth",
    0.05,
    0.36
  );

}


/* =========================
   あいこ音
========================= */

function playDrawSound(){

  /*
   * ポン、ポン
   */

  playTone(
    520,
    130,
    "triangle",
    0.065,
    0
  );


  playTone(
    520,
    130,
    "triangle",
    0.065,
    0.20
  );

}


/* =========================
   CPUの手
========================= */

function cpuChoice(){

  const choices = [

    "rock",

    "scissors",

    "paper"

  ];


  return choices[
    Math.floor(
      Math.random() *
      choices.length
    )
  ];

}


/* =========================
   勝敗判定
========================= */

function judge(player,cpu){

  if(player === cpu){

    return "draw";

  }


  if(

    (
      player === "rock" &&
      cpu === "scissors"
    )

    ||

    (
      player === "scissors" &&
      cpu === "paper"
    )

    ||

    (
      player === "paper" &&
      cpu === "rock"
    )

  ){

    return "win";

  }


  return "lose";

}


/* =========================
   キャラクター画像変更
========================= */

function changePiplup(state){

  const piplup =
    document.getElementById(
      "piplup"
    );


  if(!piplup){

    return;

  }


  piplup.src =
    piplupImages[state];


  if(state === "normal"){

    piplup.alt =
      "青いペンギン風キャラクター";

  }

  else if(state === "win"){

    piplup.alt =
      "喜んでいる青いペンギン風キャラクター";

  }

  else if(state === "lose"){

    piplup.alt =
      "悲しそうな青いペンギン風キャラクター";

  }

  else if(state === "draw"){

    piplup.alt =
      "困惑している青いペンギン風キャラクター";

  }

}


/* =========================
   相手の手を表示
========================= */

function showOpponentHand(cpu){

  const opponentHand =
    document.getElementById(
      "opponentHand"
    );


  const opponentName =
    document.getElementById(
      "opponentName"
    );


  if(!opponentHand){

    return;

  }


  /*
   * 絵文字
   */

  opponentHand.querySelector(
    ".emoji"
  ).textContent =
    hands[cpu];


  /*
   * グー / チョキ / パー
   */

  opponentName.textContent =
    names[cpu];


  /*
   * 出現アニメーションを
   * 毎回リセット
   */

  opponentHand.classList.remove(
    "reveal"
  );


  void opponentHand.offsetWidth;


  opponentHand.classList.add(
    "reveal"
  );

}


/* =========================
   相手の手を隠す
========================= */

function hideOpponentHand(){

  const opponentHand =
    document.getElementById(
      "opponentHand"
    );


  const opponentName =
    document.getElementById(
      "opponentName"
    );


  if(!opponentHand){

    return;

  }


  opponentHand.classList.remove(
    "reveal"
  );


  opponentHand.querySelector(
    ".emoji"
  ).textContent =
    "❔";


  opponentName.textContent =
    "？？？";

}


/* =========================
   じゃんけん
========================= */

function play(player){

  /*
   * 連打防止
   */

  if(busy){

    return;

  }


  busy = true;


  /*
   * 音を鳴らすため
   * 最初のタップでAudioContextを開始
   */

  if(sound){

    getAudioContext();

  }


  /*
   * ボタン無効化
   */

  document
    .querySelectorAll(".hand")
    .forEach(button=>{

      button.disabled =
        true;

    });


  const character =
    document.getElementById(
      "character"
    );


  const speech =
    document.getElementById(
      "speech"
    );


  const result =
    document.getElementById(
      "result"
    );


  /*
   * キャラクター状態をリセット
   */

  character.classList.remove(

    "normal",
    "win",
    "lose",
    "draw",
    "playing"

  );


  /*
   * 通常画像
   */

  changePiplup(
    "normal"
  );


  /*
   * 相手の手を隠す
   */

  hideOpponentHand();


  /*
   * じゃんけん中
   */

  character.classList.add(
    "playing"
  );


  /*
   * セリフ
   */

  speech.textContent =
    "じゃーん　けーん";


  /*
   * 結果を消す
   */

  result.textContent =
    "";


  /*
   * カウント音
   */

  playCountSound();


  /*
   * ぽん！
   */

  setTimeout(()=>{

    speech.textContent =
      "ぽん！";


    playPonSound();

  },650);


  /*
   * 結果発表
   */

  setTimeout(()=>{


    /*
     * CPUの手
     */

    const cpu =
      cpuChoice();


    /*
     * 勝敗
     */

    const r =
      judge(
        player,
        cpu
      );


    /*
     * じゃんけん終了
     */

    character.classList.remove(
      "playing"
    );


    /*
     * 相手の手を表示
     */

    showOpponentHand(cpu);


    /*
     * 勝ち
     */

    if(r === "win"){

      result.textContent =
        "あなたの勝ち！ 🎉";


      changePiplup(
        "win"
      );


      character.classList.add(
        "win"
      );


      /*
       * 勝利音
       */

      playWinSound();

    }


    /*
     * 負け
     */

    else if(r === "lose"){

      result.textContent =
        "あなたの負け…";


      changePiplup(
        "lose"
      );


      character.classList.add(
        "lose"
      );


      /*
       * 敗北音
       */

      playLoseSound();

    }


    /*
     * あいこ
     */

    else{

      result.textContent =
        "あいこ！";


      changePiplup(
        "draw"
      );


      character.classList.add(
        "draw"
      );


      /*
       * あいこ音
       */

      playDrawSound();

    }


    /*
     * 上部表示
     */

    speech.textContent =
      `あなた：${names[player]}　相手：${names[cpu]}`;


    /*
     * 結果アニメーション
     */

    result.classList.remove(
      "flash"
    );


    void result.offsetWidth;


    result.classList.add(
      "flash"
    );


    /*
     * 少し待って再操作可能
     */

    setTimeout(()=>{

      document
        .querySelectorAll(".hand")
        .forEach(button=>{

          button.disabled =
            false;

        });


      busy = false;

    },450);


  },1000);

}


/* =========================
   リセット
========================= */

function resetGame(){

  /*
   * ゲーム状態
   */

  busy = false;


  const character =
    document.getElementById(
      "character"
    );


  const speech =
    document.getElementById(
      "speech"
    );


  const result =
    document.getElementById(
      "result"
    );


  /*
   * キャラクター状態
   */

  character.classList.remove(

    "win",
    "lose",
    "draw",
    "playing"

  );


  character.classList.add(
    "normal"
  );


  /*
   * 通常画像
   */

  changePiplup(
    "normal"
  );


  /*
   * 相手の手をリセット
   */

  hideOpponentHand();


  /*
   * テキスト
   */

  speech.textContent =
    "じゃーん　けーん";


  result.textContent =
    "どれを出す？";


  /*
   * 結果アニメーション削除
   */

  result.classList.remove(
    "flash"
  );


  /*
   * ボタン有効化
   */

  document
    .querySelectorAll(".hand")
    .forEach(button=>{

      button.disabled =
        false;

    });

}


/* =========================
   音ON/OFF
========================= */

function toggleSound(){

  sound = !sound;


  document.getElementById(
    "soundBtn"
  ).textContent =

    sound

      ? "🔊 音ON"

      : "🔇 音OFF";


  /*
   * ONにした瞬間に
   * AudioContextを準備
   */

  if(sound){

    getAudioContext();

  }

}

</script>
