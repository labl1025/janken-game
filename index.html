<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffc20a">
<title>じゃんけん！</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:#f5f5f5}
body{display:flex;justify-content:center;align-items:center;overflow:hidden}
.app{width:min(100vw,430px);height:100dvh;min-height:620px;background:#ffc20a;position:relative;overflow:hidden;display:flex;flex-direction:column}
.close{position:absolute;right:18px;top:14px;color:#fff;font-size:34px;font-weight:200;line-height:1;background:none;border:0;z-index:5}
.title{height:105px;display:flex;justify-content:center;align-items:flex-end;padding-bottom:6px;color:#fff;font-size:34px;font-weight:900;letter-spacing:.06em;text-shadow:0 2px 0 rgba(0,0,0,.04)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 10px 12px;min-width:0}
.speech{height:64px;width:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(20px,6.5vw,28px);font-weight:900;letter-spacing:.04em;transform:rotate(-3deg);text-shadow:0 2px 0 rgba(0,0,0,.05);white-space:nowrap}
.character{width:205px;height:235px;display:flex;align-items:flex-end;justify-content:center;margin:2px 0 16px}
.penguin{width:170px;height:188px;object-fit:contain}
.result{min-height:55px;color:#fff;font-size:27px;font-weight:900;text-align:center;line-height:1.25;white-space:pre-line;text-shadow:0 2px 0 rgba(0,0,0,.05)}
.hands{display:flex;gap:22px;margin-top:8px}
.hand{width:82px;height:82px;border:0;border-radius:50%;background:#7441c7;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(65,24,123,.25);cursor:pointer;transition:transform .08s,filter .15s}
.hand:active{transform:scale(.91)}
.hand[disabled]{filter:grayscale(1);opacity:.45}
.hand span{font-size:51px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.controls{height:92px;display:flex;align-items:center;justify-content:center;gap:12px}
.small{border:0;border-radius:999px;padding:11px 18px;background:rgba(255,255,255,.92);color:#5b3990;font-size:15px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.flash{animation:flash .25s ease}
.bounce{animation:bounce .35s ease}
@keyframes flash{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes bounce{0%{transform:translateY(0)}40%{transform:translateY(-13px)}100%{transform:translateY(0)}}
@media (max-height:700px){.title{height:75px}.character{transform:scale(.82);margin:-18px 0 -8px}.hands{gap:14px}.hand{width:72px;height:72px}.controls{height:70px}}
</style>
</head>
<body>
<div class="app">
  <button class="close" aria-label="リセット" onclick="resetGame()">×</button>
  <div class="title">じゃんけん！</div>

  <section class="stage">
    <div class="speech" id="speech">じゃーん　けーん</div>

    <div class="character" id="character">
      <img class="penguin" src="https://static.wixstatic.com/media/a9144a_d046d7527d09486ab936bcd420d0deb7~mv2.png/v1/fill/w_118%2Ch_130%2Cal_c%2Cq_85%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/%E3%83%88%E3%83%AA%E4%B8%B8%E3%81%8F%E3%82%93%403x.png" alt="トリ丸">
    </div>

    <div class="result" id="result">どれを出す？</div>

    <div class="hands" id="hands">
      <button class="hand" onclick="play('rock')" aria-label="グー"><span>✊</span></button>
      <button class="hand" onclick="play('scissors')" aria-label="チョキ"><span>✌️</span></button>
      <button class="hand" onclick="play('paper')" aria-label="パー"><span>🖐️</span></button>
    </div>
  </section>

  <div class="controls">
    <button class="small" onclick="toggleSound()" id="soundBtn">🔊 音ON</button>
  </div>
</div>

<script>
const hands={rock:"✊",scissors:"✌️",paper:"🖐️"};
const names={rock:"グー",scissors:"チョキ",paper:"パー"};
const torimaruImage = "https://static.wixstatic.com/media/a9144a_d046d7527d09486ab936bcd420d0deb7~mv2.png/v1/fill/w_118%2Ch_130%2Cal_c%2Cq_85%2Cusm_0.66_1.00_0.01%2Cenc_avif%2Cquality_auto/%E3%83%88%E3%83%AA%E4%B8%B8%E3%81%8F%E3%82%93%403x.png";
function showTorimaru(){
  document.getElementById("character").innerHTML = `<img class="penguin" src="${torimaruImage}" alt="トリ丸">`;
}
let sound=true, busy=false;

function cpuChoice(){return ["rock","scissors","paper"][Math.floor(Math.random()*3)]}
function judge(a,b){
  if(a===b)return "draw";
  return ((a==="rock"&&b==="scissors")||(a==="scissors"&&b==="paper")||(a==="paper"&&b==="rock"))?"win":"lose";
}
function beep(freq,dur=80){
  if(!sound)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();
    o.frequency.value=freq;o.type="sine";g.gain.value=.035;o.connect(g);g.connect(ctx.destination);o.start();
    setTimeout(()=>{o.stop();ctx.close()},dur);
  }catch(e){}
}
function play(player){
  if(busy)return;
  busy=true;
  document.querySelectorAll(".hand").forEach(b=>b.disabled=true);
  const character=document.getElementById("character"), speech=document.getElementById("speech"), result=document.getElementById("result");
  showTorimaru();
  speech.textContent="じゃーん　けーん";
  result.textContent="";
  character.classList.remove("bounce"); void character.offsetWidth; character.classList.add("bounce");
  beep(520,70);
  setTimeout(()=>{speech.textContent="ぽん！"; beep(780,100)},650);
  setTimeout(()=>{
    const cpu=cpuChoice(), r=judge(player,cpu);
    if(r==="win"){result.textContent="あなたの勝ち！ 🎉"}
    if(r==="lose"){result.textContent="あなたの負け…"}
    if(r==="draw"){result.textContent="あいこ！"}
    speech.textContent=`あなた：${names[player]}　相手：${names[cpu]}`;
    character.innerHTML=`<div style="font-size:145px;line-height:1">${hands[cpu]}</div>`;
    result.classList.remove("flash");void result.offsetWidth;result.classList.add("flash");
    beep(r==="win"?900:r==="lose"?260:620,120);
    setTimeout(()=>{
      document.querySelectorAll(".hand").forEach(b=>b.disabled=false);
      busy=false;
    },450);
  },1000);
}
function resetGame(){
  busy=false;
  document.getElementById("speech").textContent="じゃーん　けーん";
  document.getElementById("result").textContent="どれを出す？";
  document.getElementById("character").innerHTML=`<img class="penguin" src="${torimaruImage}" alt="トリ丸">`;
  document.querySelectorAll(".hand").forEach(b=>b.disabled=false);
}
function toggleSound(){
  sound=!sound;
  document.getElementById("soundBtn").textContent=sound?"🔊 音ON":"🔇 音OFF";
}
</script>
</body>
</html>
